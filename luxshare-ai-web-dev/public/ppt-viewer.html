<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>PPT 预览</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #app { height: 100%; display: flex; flex-direction: column; }
      #toolbar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f7f7f7; border-bottom: 1px solid #e5e7eb; }
      #viewer { flex: 1; overflow: auto; background: #fff; padding: 0; }
      .hint { padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="prev" disabled>上一页</button>
        <button id="next" disabled>下一页</button>
        <span id="page_info" style="margin-left: 8px;">-/-</span>
        <div style="flex:1"></div>
      </div>
      <div id="viewer"></div>
    </div>
    <script>
      (function(){
        // Provide globals that the UMD build expects in browser
        if (!window.VueDemi && window.Vue) window.VueDemi = window.Vue;
        if (!window.process) window.process = { env: { NODE_ENV: 'production' } };
        if (!window.global) window.global = window;
        function getQueryParam(name) { return new URLSearchParams(window.location.search).get(name); }
        const src = getQueryParam('src');
        const pageRaw = parseInt(getQueryParam('page'), 10);
        const initPage = Number.isFinite(pageRaw) && pageRaw > 0 ? pageRaw : 1;
        if (!src) {
          document.getElementById('viewer').innerHTML = '<div class="hint">已回退至 Office Online 预览（不支持页码跳转）</div>';
          return;
        }

        const { createApp, h, nextTick } = Vue;
        const viewer = document.getElementById('viewer');
        const toolbar = document.getElementById('toolbar');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const pageInfo = document.getElementById('page_info');

        function ensurePptx(cb, fallback){
          if (window.VueOfficePptx || window['vue-office-pptx']) return cb();
          const load = (src, onerr) => { const s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = onerr; document.head.appendChild(s); };
          const preferCdn = sessionStorage.getItem('pptxUseCdn') === '1';
          if (preferCdn){
            load('https://unpkg.com/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', () => {
              load('https://cdn.jsdelivr.net/npm/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', () => {
                load('/vendor/vue-office-pptx/lib/v3/vue-office-pptx.umd.js', fallback);
              });
            });
          } else {
            load('/vendor/vue-office-pptx/lib/v3/vue-office-pptx.umd.js', () => {
              load('https://unpkg.com/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', () => {
                load('https://cdn.jsdelivr.net/npm/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', fallback);
              });
            });
          }
        }

        function updatePageInfo(cur, total){ pageInfo.textContent = cur + ' / ' + total; }
        function enableToolbar(total){ toolbar.style.display=''; prevBtn.disabled = nextBtn.disabled = (total <= 1); }
        // 取滚动容器（库内部创建 .pptx-preview-wrapper，overflow-y: auto）
        function getScroller(){
          return document.querySelector('.pptx-preview-wrapper') || viewer;
        }
        // 尝试更精确地识别每一页：优先取 wrapper 的直接子元素中“高度接近视口”的块，按 top 去重排序
        function getSlidesSmart(){
          const scroller = getScroller();
          const vh = scroller.clientHeight || 1;
          let candidates = Array.from(scroller.children || []);
          if (!candidates.length) {
            candidates = Array.from(scroller.querySelectorAll('section, .slide, .ppt-page, .page, .vo-ppt-slide, .ppt-slide'));
          }
          let items = candidates.filter(el => {
            const r = el.getBoundingClientRect();
            return r.height >= vh * 0.9; // 0.9 阈值
          });
          if (items.length < 2) {
            const viaBg = Array.from(scroller.querySelectorAll('.slide-background')).map(b => b.parentElement).filter(Boolean);
            if (viaBg.length) items = viaBg;
          }
          const groups = [];
          items.forEach(el => {
            const top = Math.round(el.getBoundingClientRect().top);
            const hit = groups.find(g => Math.abs(g.top - top) <= 8);
            if (!hit) groups.push({ top, el });
          });
          groups.sort((a,b)=>a.top - b.top);
          return groups.map(g => g.el);
        }
        // 估算单页高度与总页数：以 wrapper 的直接子元素中高度接近视口的元素为单位（取中位数），避免因间距造成的高估
        function estimateUnitHeight(scroller){
          const vh = scroller.clientHeight; if (!vh) return { unit: vh, total: 1 };
          const children = Array.from(scroller.children || []);
          const heights = children.map(el => el.getBoundingClientRect().height).filter(h => h >= vh * 0.90);
          const arr = heights.length ? heights.sort((a,b)=>a-b) : [vh];
          const unit = arr.length % 2 ? arr[(arr.length-1)/2] : 0.5*(arr[arr.length/2-1]+arr[arr.length/2]);
          const total = Math.max(1, Math.round(scroller.scrollHeight / unit));
          return { unit, total };
        }
        function estimateTotalByScroll(scroller){ return estimateUnitHeight(scroller).total }
        // 基于估算的单页高度滚动到目标页（1-based）
        function scrollToByFraction(scroller, targetIndex, total){
          const { unit } = estimateUnitHeight(scroller);
          const sh = scroller.scrollHeight; const vh = scroller.clientHeight;
          const top = Math.min(Math.max((targetIndex-1) * unit, 0), Math.max(sh - vh, 0));
          scroller.scrollTo({ top, behavior: 'auto' });
        }
        function redirectToPdf(){
          try {
            const pdfSrc = src.replace(/\.(pptx|ppt)(?=([?#]|$))/i, '.pdf');
            const url = '/pdf-viewer.html?src=' + encodeURIComponent(pdfSrc) + '&page=' + initPage;
            window.location.replace(url);
          } catch(_) {
            fallbackOffice();
          }
        }

        function gotoInitialPage(){
          let done = false; let attempts = 0; let obs;
          const getSlides = () => getSlidesSmart();
          const getScrollParent = (el) => {
            let p = el && el.parentElement; const html = document.documentElement;
            while (p && p !== html) {
              const st = getComputedStyle(p);
              if (/(auto|scroll)/i.test(st.overflowY)) return p;
              p = p.parentElement;
            }
            return viewer; // fallback
          };
          const scrollToEl = (el, total) => {
            const scroller = getScrollParent(el);
            const top = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
            scroller.scrollTo({ top, behavior: 'auto' });
            enableToolbar(total); // enable controls after first position
          };
          const tryScroll = () => {
            if (done) return true;
            const slides = getSlides();
            const total = Math.max(slides.length || 0, 1);
            const targetIdx = Math.min(Math.max(initPage,1), total) - 1;
            const el = slides[targetIdx];
            if (el) {
              scrollToEl(el, total);
              updatePageInfo(targetIdx+1, total);
              // 持续校验，避免后续图片加载引起回弹
              let checks = 0; const verify = setInterval(() => {
                const nowSlides = getSlides();
                const idx = (function(){
                  let i0 = 0, d0 = Infinity; const top = viewer.getBoundingClientRect().top;
                  nowSlides.forEach((e,i)=>{ const d = Math.abs(e.getBoundingClientRect().top - top); if (d < d0) { d0 = d; i0 = i; } });
                  return i0;
                })();
                if (idx === targetIdx || ++checks > 30) { clearInterval(verify); done = true; if (obs) obs.disconnect(); }
                else { const t = nowSlides[targetIdx] || el; if (t) scrollToEl(t, total); }
              }, 200);
              return true;
            }
            // 如果没识别到具体 slide 节点，则按比例滚动作为退化方案
            const scroller = getScroller();
            const estTotal = estimateTotalByScroll(scroller);
            if (estTotal > 1) {
              scrollToByFraction(scroller, initPage, estTotal);
              updatePageInfo(Math.min(initPage, estTotal), estTotal);
              enableToolbar(estTotal);
              done = true; if (obs) obs.disconnect();
              return true;
            }
            if (++attempts > 100) { if (obs) obs.disconnect(); return false; }
            return false;
          };
          obs = new MutationObserver(tryScroll);
          obs.observe(viewer, { childList: true, subtree: true });
          const timer = setInterval(() => { if (tryScroll()) clearInterval(timer); if (attempts > 100) clearInterval(timer); }, 100);
          tryScroll();
        }

        function getCurrentIndex(slides){
          let idx = 0, minDist = Infinity; const top = viewer.getBoundingClientRect().top;
          slides.forEach((el,i)=>{ const d = Math.abs(el.getBoundingClientRect().top - top); if(d < minDist){ minDist=d; idx=i } });
          return idx;
        }
        function nav(delta){
          const slides = getSlidesSmart();
          let total = Math.max(slides.length || 0, 1);
          if (total > 1){
            const current = getCurrentIndex(slides)+1;
            let target = Math.min(Math.max(current + delta,1), total);
            const el = slides[target-1]; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            updatePageInfo(target, total);
          } else {
            // 无法识别单页节点时，退化为按比例滚动
            const scroller = getScroller();
            const { unit } = estimateUnitHeight(scroller);
            total = estimateTotalByScroll(scroller);
            const cur = Math.round(scroller.scrollTop / (unit || 1)) + 1;
            const target = Math.min(Math.max(cur + delta,1), total);
            scrollToByFraction(scroller, target, total);
            updatePageInfo(target, total);
            enableToolbar(total);
          }
        }

        function setupNavigation(){ prevBtn.addEventListener('click', ()=>nav(-1)); nextBtn.addEventListener('click', ()=>nav(1)); }

        let triedCdnFix = false;
        function mountVue(){
          const __PPTX__ = window["vue-office-pptx"] || window.VueOfficePptx; const Pptx = (__PPTX__ && (__PPTX__.default || __PPTX__)) || null;
          if (!Pptx) return fallbackOffice();
          const App = {
            data(){ return { src } },
            render(){
              const w = Math.max(320, viewer.clientWidth || 960);
              const hgt = Math.max(240, viewer.clientHeight || 540);
              return h(Pptx, { src: this.src, options: { width: w, height: hgt }, onRendered: this.onRendered, onError: this.onError })
            },
            methods: {
              onRendered(){ nextTick(() => { setupNavigation(); gotoInitialPage(); }); },
              onError(err){
                if (!triedCdnFix){
                  triedCdnFix = true;
                  const load = (src, onerr) => { const s=document.createElement('script'); s.src=src; s.onload=()=>location.reload(); s.onerror=onerr; document.head.appendChild(s); };
                  load('https://unpkg.com/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', ()=>{
                    load('https://cdn.jsdelivr.net/npm/@vue-office/pptx/lib/v3/vue-office-pptx.umd.js', ()=>{
                      console.error('PPTX CDN retry failed:', err);
                      redirectToPdf();
                    });
                  });
                } else {
                  console.error('PPTX render error:', err);
                  redirectToPdf();
                }
              }
            }
          };
          createApp(App).mount('#viewer');
        }

        function fallbackOffice(){
          const officeUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(src);
          viewer.innerHTML = '<iframe style="border:0;width:100%;height:100%" src="'+officeUrl+'"></iframe>'+
                             '<div class="hint">已回退至 Office Online 预览（不支持页码跳转）</div>';
          toolbar.style.display = 'none'; prevBtn.disabled = true; nextBtn.disabled = true; pageInfo.textContent = '-/-';
        }

        ensurePptx(() => { mountVue(); }, () => { fallbackOffice(); });
      })();
    </script>
  </body>
  </html>
