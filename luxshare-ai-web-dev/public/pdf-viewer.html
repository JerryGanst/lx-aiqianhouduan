<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>PDF 预览</title>
    <style>
      html, body { height: 100%; margin: 0; }
      .container { height: 100%; display: flex; align-items: stretch; }
      .fallback { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 24px; }
      iframe { border: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <div id="toolbar" style="position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f7f7f7; border-bottom: 1px solid #e5e7eb; z-index: 10;">
        <button id="prev">上一页</button>
        <button id="next">下一页</button>
        <span id="page_info" style="margin-left: 8px;">-/-</span>
        <div style="flex: 1"></div>
        <button id="zoom_out">-</button>
        <button id="zoom_in">+</button>
      </div>
      <div id="viewer" style="flex:1; width:100%; height:100%; overflow:auto; padding-top: 44px; display:flex; justify-content:center; align-items:flex-start; background:#fff;">
        <canvas id="canvas"></canvas>
      </div>
    </div>
    <!-- 轻量集成：在本页通过 CDN 引入 pdf.js，而非使用跨域的 viewer.html -->
    <!-- 去掉 SRI 以避免哈希漂移导致脚本被拦截；如需严格校验，可改为本地托管脚本。 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" referrerpolicy="no-referrer"></script>
    <script>
      (function () {
        function getQueryParam(name) {
          const params = new URLSearchParams(window.location.search);
          return params.get(name);
        }

        const src = getQueryParam('src');
        const pageRaw = getQueryParam('page');
        let page = parseInt(pageRaw, 10);
        if (!Number.isFinite(page) || page < 1) page = 1;

        if (!src) {
          document.body.innerHTML = '<div class="fallback">缺少 src 参数，无法加载 PDF。</div>';
          return;
        }

        // 配置 worker 来源（CDN）。如需离线化，可改为本地路径。
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pageInfoEl = document.getElementById('page_info');
        const btnPrev = document.getElementById('prev');
        const btnNext = document.getElementById('next');
        const btnZoomIn = document.getElementById('zoom_in');
        const btnZoomOut = document.getElementById('zoom_out');

        let pdfDoc = null;
        let currentPage = page;
        let scale = 1.2;
        let rendering = false;
        let pendingPage = null;

        function renderPage(num) {
          rendering = true;
          pdfDoc.getPage(num).then(function(page) {
            const viewport = page.getViewport({ scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = { canvasContext: ctx, viewport };
            const renderTask = page.render(renderContext);
            renderTask.promise.then(function () {
              rendering = false;
              pageInfoEl.textContent = num + ' / ' + pdfDoc.numPages;
              if (pendingPage !== null) {
                const p = pendingPage; pendingPage = null; renderPage(p);
              }
            });
          });
        }

        function queueRenderPage(num) {
          if (rendering) {
            pendingPage = num;
          } else {
            renderPage(num);
          }
        }

        btnPrev.addEventListener('click', function () {
          if (currentPage <= 1) return;
          currentPage--; queueRenderPage(currentPage);
        });

        btnNext.addEventListener('click', function () {
          if (!pdfDoc) return; if (currentPage >= pdfDoc.numPages) return;
          currentPage++; queueRenderPage(currentPage);
        });

        btnZoomIn.addEventListener('click', function () {
          scale = Math.min(3, scale + 0.2); queueRenderPage(currentPage);
        });

        btnZoomOut.addEventListener('click', function () {
          scale = Math.max(0.4, scale - 0.2); queueRenderPage(currentPage);
        });

        // 加载 PDF（跨域时需后端允许 CORS）。禁用 Range/Stream 以提升兼容性。
        pdfjsLib.getDocument({
            url: src,
            withCredentials: false,
            disableRange: true,
            disableStream: true,
            disableAutoFetch: true
        }).promise
          .then(function (doc) {
            pdfDoc = doc;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > pdfDoc.numPages) currentPage = pdfDoc.numPages;
            renderPage(currentPage);
          })
          .catch(function (err) {
            document.body.innerHTML = '<div class="fallback">无法加载 PDF：' + (err && (err.message || err)) + '</div>';
          });
      })();
    </script>
  </body>
  </html>
