# 将该片段放入目标站点的 server 块中，
# 并确保它在 SPA 兜底 `try_files ... /index.html;` 之前。

# 注意：如果在 location 中使用了带结尾斜杠的 proxy_pass，会发生 URI 重写。
# 推荐：使用「精确匹配 + 不带 URI 的 proxy_pass」或「proxy_pass 到完整路径且等号精确匹配」

# 方案一：后端无 context-path：
location = /wecom/callback {{
  # 方式 A（推荐）：不带 URI，原始 URI 将被保留转发
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 30s;
  client_max_body_size 2m;
}}

# 方案二：明确到完整路径（也可行，但需要等号精确匹配）：
# location = /wecom/callback {{
#   proxy_pass http://127.0.0.1:8080/wecom/callback;
# }}

# 如果你的 Spring Boot 有 server.servlet.context-path=/api：
# location = /api/wecom/callback {{
#   proxy_pass http://127.0.0.1:8080;
# }}

# 错误示例（常见 GET 命不中原因之一）：
# location / {{ try_files $uri $uri/ /index.html; }}   # 放在这之前没有专门的 /wecom/callback，则会被 SPA 吃掉返回 HTML
